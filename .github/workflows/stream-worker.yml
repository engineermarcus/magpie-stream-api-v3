name: stream-worker

on:
  workflow_dispatch:
    inputs:
      callback_url:
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib/python3.12/site-packages
            ~/.local/bin
            ~/.cache/ms-playwright
          key: stream-deps-v2

      - name: Install deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          pip install playwright playwright-stealth urllib3 httpx --quiet
          python3 -m playwright install chromium

      - name: Install system deps
        run: python3 -m playwright install-deps chromium || true

      - name: Start server
        run: |
          python3 -u app.py &
          for i in $(seq 1 30); do
            curl -s localhost:8888/health >/dev/null && break
            sleep 1
          done
          echo "server ready"

      - name: Poll and resolve
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          echo "runner started, polling for jobs..."
          END=$((SECONDS + 6600))
          while [ $SECONDS -lt $END ]; do
            RESPONSE=$(curl -s --max-time 25 "$CALLBACK_URL/poll" || true)
            JOB=$(echo "$RESPONSE" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    j = d.get('job')
    print(json.dumps(j) if j else '')
except:
    print('')
" 2>/dev/null)

            if [ -z "$JOB" ]; then
              continue
            fi

            JOB_ID=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")
            TMDB_ID=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin)['tmdb_id'])")
            MEDIA_TYPE=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin)['type'])")
            SEASON=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('season',1))")
            EPISODE=$(echo "$JOB" | python3 -c "import sys,json; print(json.load(sys.stdin).get('episode',1))")

            echo "got job $JOB_ID tmdb=$TMDB_ID type=$MEDIA_TYPE"

            if [ "$MEDIA_TYPE" = "movie" ]; then
              RESULT=$(curl -s --max-time 90 localhost:8888/stream/movie/$TMDB_ID)
            else
              RESULT=$(curl -s --max-time 90 localhost:8888/stream/tv/$TMDB_ID/$SEASON/$EPISODE)
            fi

            echo "result: $RESULT"

            curl -s -X POST "$CALLBACK_URL/job" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\": \"$JOB_ID\", \"result\": $RESULT}"

            echo "job $JOB_ID done"
          done
