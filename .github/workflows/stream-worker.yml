name: stream-worker

on:
  workflow_dispatch:
    inputs:
      callback_url:
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and start server
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/stream:latest
          docker run -d --name stream --shm-size=1g -p 8888:8888 \
            ghcr.io/${{ github.repository_owner }}/stream:latest

          for i in $(seq 1 30); do
            curl -s localhost:8888/health >/dev/null && break
            sleep 1
          done

      - name: Start tunnel and register
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:8888 > tunnel.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "ERROR: tunnel never started"
            cat tunnel.log
            exit 1
          fi

          echo "tunnel: $TUNNEL_URL"

          REGISTER=$(curl -s -X POST "$CALLBACK_URL/register" \
            -H "Content-Type: application/json" \
            -d "{\"tunnel_url\": \"$TUNNEL_URL\"}")
          echo "register response: $REGISTER"
          RUNNER_ID=$(echo "$REGISTER" | python3 -c "import sys,json; print(json.load(sys.stdin)['runner_id'])")
          echo "runner_id: $RUNNER_ID"

          END=$((SECONDS + 6600))
          while [ $SECONDS -lt $END ]; do
            curl -s -X POST "$CALLBACK_URL/heartbeat" \
              -H "Content-Type: application/json" \
              -d "{\"runner_id\": \"$RUNNER_ID\"}" >/dev/null
            sleep 30
          done
