name: stream-worker

on:
  workflow_dispatch:
    inputs:
      callback_url:
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and start server
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/stream:latest
          docker run -d --name stream --shm-size=1g -p 8888:8888 \
            ghcr.io/${{ github.repository_owner }}/stream:latest

          for i in $(seq 1 30); do
            curl -s localhost:8888/health >/dev/null && break
            sleep 1
          done

      - name: Start tunnel and register
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:8888 > tunnel.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 1
          done

          echo "tunnel: $TUNNEL_URL"

          # Register with dispatch server
          curl -s -X POST "$CALLBACK_URL/register" \
            -H "Content-Type: application/json" \
            -d "{\"tunnel_url\": \"$TUNNEL_URL\"}"

          # Stay alive for 1h50m then die (workflow limit is ~2hrs)
          sleep 6600
