name: stream-worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      tmdb_id:
        required: true
      media_type:
        required: true
      season:
        default: "1"
      episode:
        default: "1"
      callback_url:
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository_owner }}/stream:latest

      - name: Start container
        run: |
          docker run -d --name stream \
            --shm-size=1g \
            -p 8888:8888 \
            ghcr.io/${{ github.repository_owner }}/stream:latest

          for i in $(seq 1 30); do
            curl -s localhost:8888/health >/dev/null && echo "ready" && break
            echo "waiting... $i"
            sleep 2
          done

          docker logs stream

      - name: Resolve and callback
        env:
          JOB_ID: ${{ inputs.job_id }}
          TMDB_ID: ${{ inputs.tmdb_id }}
          MEDIA_TYPE: ${{ inputs.media_type }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          if [ "$MEDIA_TYPE" = "movie" ]; then
            RESULT=$(curl -s -m 120 "http://localhost:8888/stream/movie/$TMDB_ID")
          else
            RESULT=$(curl -s -m 120 "http://localhost:8888/stream/tv/$TMDB_ID/$SEASON/$EPISODE")
          fi

          echo "result: $RESULT"

          curl -s -X POST "$CALLBACK_URL/callback/$JOB_ID" \
            -H "Content-Type: application/json" \
            -d "{\"stream\": $RESULT}"
