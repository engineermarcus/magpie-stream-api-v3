name: stream-worker

on:
  workflow_dispatch:
    inputs:
      callback_url:
        required: true
      job_id:
        required: true
      tmdb_id:
        required: true
      media_type:
        required: true
      season:
        required: false
        default: "1"
      episode:
        required: false
        default: "1"

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and start server
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/stream:latest
          docker run -d --name stream --shm-size=1g -p 8888:8888 \
            ghcr.io/${{ github.repository_owner }}/stream:latest

          for i in $(seq 1 30); do
            curl -s localhost:8888/health >/dev/null && break
            sleep 1
          done

      - name: Resolve and report
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          JOB_ID: ${{ inputs.job_id }}
          TMDB_ID: ${{ inputs.tmdb_id }}
          MEDIA_TYPE: ${{ inputs.media_type }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
        run: |
          if [ "$MEDIA_TYPE" = "movie" ]; then
            RESULT=$(curl -s localhost:8888/stream/movie/$TMDB_ID)
          else
            RESULT=$(curl -s localhost:8888/stream/tv/$TMDB_ID/$SEASON/$EPISODE)
          fi

          echo "result: $RESULT"

          curl -s -X POST "$CALLBACK_URL/job" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": \"$JOB_ID\", \"result\": $RESULT}"
